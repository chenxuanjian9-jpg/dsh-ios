name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # 必须使用 Apple Silicon 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          brew install meson ninja lld libarchive
          gem install xcodeproj

      - name: Build Emulator
        run: make emulator

      - name: Build Rootfs (Using prepare script & jitless)
        run: |
          # 尝试使用社区方案准备 rootfs
          # 注意：此脚本路径可能需要根据实际仓库结构调整，例如位于 scripts/ 目录下
          chmod +x scripts/prepare_alpine_rootfs.sh || true
          bash scripts/prepare_alpine_rootfs.sh || echo "prepare script not found or failed, trying default make rootfs"
          # 关键：在 make rootfs 时注入 --jitless 环境变量
          export NODE_OPTIONS=--jitless
          make rootfs

      - name: Archive App
        run: |
          xcodebuild archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/DSH.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DSH.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
