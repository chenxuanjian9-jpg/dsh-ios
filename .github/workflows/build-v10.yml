name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          brew install meson ninja libarchive lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH
          gem install xcodeproj

      - name: Build Emulator and Rootfs
        run: |
          make emulator
          make rootfs

      - name: Archive App
        run: |
          xcodebuild archive -project DSH.xcodeproj -scheme DSH -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/DSH.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>method</key><string>development</string></dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/DSH.xcarchive -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
