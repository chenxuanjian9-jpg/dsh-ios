name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # 必须用 M 芯片，秒开不排队，且源码只支持 M 芯片
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          brew install meson ninja libarchive lld
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Install Ruby gem xcodeproj
        run: |
          gem install xcodeproj

      - name: Build emulator
        run: |
          make emulator

      # 【核心修复】给 ish 赋予 JIT 权限并签名，防止构建 rootfs 时崩溃
      - name: Ad-hoc sign ish for macOS
        run: |
          cat <<EOF > ent.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --entitlements ent.plist ish-arm64/build-arm64-release/ish

      - name: Build rootfs
        run: |
          make rootfs

      - name: Archive app (unsigned)
        run: |
          xcodebuild archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/DSH.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (unsigned)
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DSH.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
